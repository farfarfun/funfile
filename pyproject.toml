[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "funfile"
description = "Practical file, archive, and serialization utilities"
readme = "README.md"
version = "1.0.43"
requires-python = ">=3.10"
dependencies = [ "farlog>=1.1.7", "tqdm>=4.66.5",]
license = "MIT"
license-files = ["LICENSE"]
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"
[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"
[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funfile"
Releases = "https://github.com/farfarfun/funfile/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/funfile"]

[dependency-groups]
dev = [ "pytest>=8.0.0", "ruff>=0.6.0",]

[tool.ruff]
target-version = "py310"
src = [ "src",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B", "SIM", "RUF", "BLE", "PYI",]
# RUF001-003：docstring 与注释使用中文，全角标点是有意为之。
ignore = [ "RUF001", "RUF002", "RUF003",]

[tool.pytest.ini_options]
testpaths = [ "tests",]
